[package]
name = "rangoon-openshell-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
http = "=1.5.0"
http-body-util = { version = "=0.1.5", optional = true }
prost = "=0.13.5"
prost-types = "=0.13.5"
rcgen = { version = "=0.13.2", optional = true }
rustls = { version = "=0.23.41", default-features = false, features = ["std", "ring", "tls12"] }
sha2.workspace = true
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "=0.13.1", default-features = false, features = ["channel", "codegen", "prost", "tls-ring", "tls-webpki-roots"] }
tower = "=0.5.2"
tokio-stream = { version = "=0.1.19", features = ["net"], optional = true }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
webpki-roots = "=1.0.9"
zeroize = "=1.9.0"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
sha2.workspace = true
tonic-build = "=0.13.1"

[dev-dependencies]
http-body-util = "=0.1.5"
rcgen = "=0.13.2"
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.13.1", default-features = false, features = ["channel", "codegen", "prost", "router", "server", "tls-ring", "tls-webpki-roots", "transport"] }

[features]
synthetic-peer-test-support = [
    "dep:http-body-util",
    "dep:rcgen",
    "dep:tokio-stream",
    "tonic/router",
    "tonic/server",
    "tonic/transport",
]
