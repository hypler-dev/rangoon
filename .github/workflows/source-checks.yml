name: Source checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

env:
  RANGOON_RUST_VERSION: '1.99.1'
  RUSTUP_AUTO_INSTALL: '0'

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Check Rust version coherence before provisioning
        run: node scripts/check-source-rust.mjs --check-config
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install ${{ env.RANGOON_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Core toolchain coherence, format, tests and Clippy
        run: node scripts/check-source-rust.mjs

  preview:
    name: Preview and review artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: npm run build:check
      - run: node scripts/validate-review.mjs
      - run: git diff --check

  desktop:
    name: Desktop spike / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Check Rust version coherence before provisioning
        run: node scripts/check-source-rust.mjs --check-config
      - name: Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Desktop toolchain
        run: rustup toolchain install ${{ env.RANGOON_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Desktop toolchain coherence, format, tests, Clippy and native build without installers
        run: node scripts/check-source-rust.mjs --desktop
