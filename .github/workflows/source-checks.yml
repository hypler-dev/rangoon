name: Source checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the minimum supported source toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Toolchain evidence
        run: rustup run 1.85.0 rustc -vV
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Tests
        run: cargo +1.85.0 test --workspace --locked
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings

  preview:
    name: Preview and review artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: npm run check
      - run: npm test
      - run: node scripts/validate-review.mjs
      - run: git diff --check
