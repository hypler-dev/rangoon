[workspace]
members = ["crates/rangoon-domain", "crates/rangoon-import", "crates/rangoon-cli", "crates/rangoon-host", "crates/rangoon-store", "crates/rangoon-engine", "crates/rangoon-compose", "crates/rangoon-compile", "crates/rangoon-model-assistance", "crates/rangoon-model-local", "crates/rangoon-model-session"]
exclude = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/hypler-dev/rangoon"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
rangoon-domain = { path = "crates/rangoon-domain" }
rangoon-import = { path = "crates/rangoon-import" }
rangoon-compose = { path = "crates/rangoon-compose" }
rangoon-compile = { path = "crates/rangoon-compile" }
