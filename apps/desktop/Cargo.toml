[package]
license = "Apache-2.0"
name = "rangoon-desktop"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/hypler-dev/rangoon"

# Keep native WebView dependencies out of the portable Rust 1.85 core workspace.
[workspace]
resolver = "3"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = "=2.12.1"
tauri-plugin-dialog = "=2.8.1"
rangoon-host = { path = "../../crates/rangoon-host" }
rangoon-domain = { path = "../../crates/rangoon-domain" }
rangoon-import = { path = "../../crates/rangoon-import" }
getrandom = "=0.3.4"
rangoon-compose = { path = "../../crates/rangoon-compose" }
rangoon-compile = { path = "../../crates/rangoon-compile" }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
rangoon-store = { path = "../../crates/rangoon-store" }
rangoon-workflow = { path = "../../crates/rangoon-workflow" }
rangoon-engine = { path = "../../crates/rangoon-engine" }
rangoon-model-session = { path = "../../crates/rangoon-model-session" }
rangoon-model-cloud = { path = "../../crates/rangoon-model-cloud" }
rangoon-model-local = { path = "../../crates/rangoon-model-local" }
tokio = { version = "=1.53.2", default-features = false, features = ["sync"] }
serde = { version = "=1.0.229", features = ["derive"] }

zeroize = "=1.9.0"
keyring-core = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
encrypted-workspace = ["rangoon-store/encrypted-sqlite"]
