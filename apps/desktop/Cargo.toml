[package]
name = "rangoon-desktop"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/hypler-dev/rangoon"

# Keep native WebView dependencies out of the portable Rust 1.85 core workspace.
[workspace]
resolver = "3"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = "=2.12.1"
tauri-plugin-dialog = "=2.8.1"
rangoon-host = { path = "../../crates/rangoon-host" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
