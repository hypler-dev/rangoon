[package]
license = "Apache-2.0"
name = "rangoon-desktop"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
publish = false
repository = "https://github.com/hypler-dev/rangoon"

# Keep native WebView dependencies separate from the portable core workspace.
[workspace]
resolver = "3"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = "=2.12.1"
rangoon-native-credential-input = { path = "native-input" }
tauri-plugin-dialog = "=2.8.1"
rangoon-host = { path = "../../crates/rangoon-host" }
rangoon-ops = { path = "../../crates/rangoon-ops" }
rangoon-domain = { path = "../../crates/rangoon-domain" }
rangoon-import = { path = "../../crates/rangoon-import" }
getrandom = "=0.3.4"
rangoon-compose = { path = "../../crates/rangoon-compose" }
rangoon-compile = { path = "../../crates/rangoon-compile" }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
rangoon-store = { path = "../../crates/rangoon-store" }
rangoon-workflow = { path = "../../crates/rangoon-workflow" }
rangoon-engine = { path = "../../crates/rangoon-engine" }
rangoon-openshell-client = { path = "../../crates/rangoon-openshell-client" }
sha2 = "=0.11.0"
rangoon-model-session = { path = "../../crates/rangoon-model-session" }
rangoon-model-cloud = { path = "../../crates/rangoon-model-cloud" }
rangoon-model-local = { path = "../../crates/rangoon-model-local" }
tokio = { version = "=1.53.2", default-features = false, features = ["sync", "rt", "net", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }

zeroize = "=1.9.0"
keyring-core = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
# Disposable loopback peers are available to tests only, never normal builds.
rangoon-openshell-client = { path = "../../crates/rangoon-openshell-client", features = ["synthetic-peer-test-support"] }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt-multi-thread"] }

[features]
native-credential-qualification = ["tauri/unstable"]
native-exit-qualification = []
native-encrypted-qualification = []
default = ["custom-protocol", "encrypted-workspace"]
custom-protocol = ["tauri/custom-protocol"]
encrypted-workspace = ["rangoon-store/encrypted-sqlite"]

# Explicit custom test executable; ordinary cargo test never launches it.
[[test]]
name = "native-exit-qualification"
path = "src/main.rs"
harness = false
test = false
required-features = ["native-exit-qualification", "encrypted-workspace"]

# Explicit real-renderer encrypted qualification; never an ordinary test entry.
[[test]]
name = "native-encrypted-qualification"
path = "src/main.rs"
harness = false
test = false
required-features = ["native-encrypted-qualification", "encrypted-workspace"]

# Explicit parented native entry qualification; ordinary tests never launch it.
[[test]]
name = "native-credential-qualification"
path = "src/main.rs"
harness = false
test = false
required-features = ["native-credential-qualification", "encrypted-workspace"]
