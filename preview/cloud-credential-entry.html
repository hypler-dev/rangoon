<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rangoon — OpenAI credential</title>
  <link rel="icon" href="assets/brand-symbol.png">
  <link rel="stylesheet" href="cloud-credential-entry.css">
  <script type="module" src="cloud-credential-entry.mjs"></script>
</head>
<body>
  <main aria-labelledby="credential-title">
    <button id="credential-theme" type="button">Light mode</button>
    <img src="assets/brand-symbol.png" alt="">
    <p class="eyebrow">RANGOON · ISOLATED CREDENTIAL ENTRY</p>
    <h1 id="credential-title">Add or replace OpenAI credential</h1>
    <p>Type a new credential once. This isolated input holds it transiently before the operating system asks whether to save it.</p>
    <p class="notice">OS custody does not protect a compromised user session or application process.</p>
    <form id="credential-form"><label for="credential-secret">New credential<input id="credential-secret" type="password" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2048" required disabled autocapitalize="off" autocorrect="off"></label><p id="credential-status" role="status" aria-live="polite">Loading isolated entry…</p><div><button id="credential-cancel" type="button" disabled>Cancel</button><button id="credential-save" type="submit" disabled>Continue to OS Save</button></div></form>
  </main>
</body>
</html>
